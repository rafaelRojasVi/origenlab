name: dashboard

permissions:
  contents: read

on:
  # Production release gate requires this check on EVERY main commit, not only path matches.
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard.yml"
      # The «Catálogo web» form is pinned to this schema by a drift test.
      - "apps/web/src/content/modelos.schema.json"

concurrency:
  group: dashboard-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs never are (the release gate reads them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - run: make test-dashboard
      - name: Lint (non-blocking)
        working-directory: apps/dashboard
        run: npm run lint
        continue-on-error: true
