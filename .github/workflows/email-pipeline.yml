name: email-pipeline

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "apps/email-pipeline/**"
      - "scripts/run_pytest.sh"
      - "scripts/test_db.sh"
      - "scripts/pytest_plugins/**"
      - "supabase/migrations/**"
      - "supabase/roles.sql"
      - ".github/workflows/email-pipeline.yml"

concurrency:
  group: email-pipeline-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs never are (the release gate reads them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The transactional Postgres files against the V1 test database, then the whole suite in
  # parallel; the V2 evidence/import proofs run against the disposable V2 cluster.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Not captured: the script's stdout carries the ::add-mask:: commands for the passwords.
      - name: Start disposable databases
        run: scripts/test_db.sh up "$RUNNER_TEMP/test-db.env"
      - name: Test
        env:
          OL_TEST_DB_ENV: ${{ runner.temp }}/test-db.env
        run: make test-email-pipeline
      - name: Remove the databases
        if: always()
        run: scripts/test_db.sh down "$RUNNER_TEMP/test-db.env"
