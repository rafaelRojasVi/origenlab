name: supabase

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths:
      - "supabase/**"
      - "docs/ARCHITECTURE.md"
      - "docs/DOMAIN.md"
      - "docs/MIGRATION.md"
      - "docs/OPERATIONS.md"
      - "docs/README.md"
      - "scripts/security/check-public-repo-hygiene.sh"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "docs/ARCHITECTURE.md"
      - "docs/DOMAIN.md"
      - "docs/MIGRATION.md"
      - "docs/OPERATIONS.md"
      - "docs/README.md"
      - "scripts/security/check-public-repo-hygiene.sh"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slice0-local:
    name: Slice 0 local evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0

      - name: Verify toolchain and guardrails
        run: |
          set -euo pipefail
          supabase --version
          docker --version
          psql --version
          python3 --version
          bash -n supabase/scripts/*.sh supabase/scripts/lib/*.sh
          scripts/security/check-public-repo-hygiene.sh

      - name: Run Slice 0 audit and hosted-bootstrap unit tests
        run: python3 -m unittest discover -s supabase/audit/tests -t supabase/audit

      # Neither step needs Docker or a running stack: the bootstrap tool opens no database
      # connection in any mode, so both run before the database is started. The dry run's stdout is
      # compared with the committed file here as well as in the failure suite, because a CI job that
      # emitted anything but those bytes would be the first sign the tool had grown a generator.
      - name: Prove the hosted role bootstrap dry run emits exactly the committed file
        run: |
          set -euo pipefail
          supabase/scripts/hosted_role_bootstrap.sh --environment staging --dry-run > "$RUNNER_TEMP/plan.sql"
          cmp supabase/hosted_roles.sql "$RUNNER_TEMP/plan.sql"

      - name: Prove the hosted role bootstrap fails closed
        run: supabase/scripts/hosted_bootstrap_failure_tests.sh

      - name: Start local database
        run: supabase start

      - name: Prove deterministic migration replay
        run: supabase/scripts/replay_evidence.sh "$RUNNER_TEMP/supabase-replay"

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Prove runtime-role behavior with direct logins
        run: supabase/scripts/verify_direct_logins.sh

      - name: Prove evidence tooling fails closed
        run: supabase/scripts/evidence_tool_failure_tests.sh

      - name: Prove the Slice 0 audit fails closed
        run: supabase/scripts/audit_failure_tests.sh

      - name: Run the Slice 0 audit against the local stack
        run: supabase/scripts/slice0_audit.sh --mode local

      # The report is re-read from the bytes that would be published, in a separate process, and
      # the upload step below runs only if this one succeeds. A report that fails the credential
      # and project-reference leak assertions is never uploaded, and neither is any raw child
      # output, temporary working directory or failure capture -- only these two sanitised files.
      - name: Prove the audit report carries no credential or project reference
        run: |
          set -euo pipefail
          supabase/scripts/slice0_audit.sh --verify-report supabase/.audit/reports/slice0-audit-local.json
          supabase/scripts/slice0_audit.sh --verify-report supabase/.audit/reports/slice0-audit-local.md

      - name: Upload the sanitised Slice 0 audit report
        uses: actions/upload-artifact@v4
        with:
          name: slice0-audit-local-report
          path: |
            supabase/.audit/reports/slice0-audit-local.json
            supabase/.audit/reports/slice0-audit-local.md
          if-no-files-found: error
          retention-days: 30

      - name: Run database linter and advisors
        run: |
          set -euo pipefail
          supabase db lint --local \
            -s crm,comms,outbound,evidence,catalog,procurement,platform \
            --level warning --fail-on warning
          supabase db advisors --local --type all --level info --fail-on warn

      - name: Stop local stack
        if: always()
        run: supabase stop
