name: supabase

permissions:
  contents: read

on:
  # Every main/dev commit must run the database compatibility CI before a production release.
  # Paths filter removed intentionally: app-only changes also need the migration gate.
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "supabase/**"
      - "docs/ARCHITECTURE.md"
      - "docs/DOMAIN.md"
      - "docs/MIGRATION.md"
      - "docs/OPERATIONS.md"
      - "docs/README.md"
      - "scripts/security/check-public-repo-hygiene.sh"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slice0-local:
    name: Slice 0 local evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.116.0

      # setup-cli pins CLI >=1.28 to GHCR. Clear that override so the CLI can
      # use its native registry fallback chain: public ECR -> GHCR -> Docker Hub.
      - name: Restore Supabase multi-registry fallback
        shell: bash
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=' >> "$GITHUB_ENV"

      - name: Verify toolchain and guardrails
        run: |
          set -euo pipefail
          supabase --version
          docker --version
          psql --version
          python3 --version
          bash -n supabase/scripts/*.sh supabase/scripts/lib/*.sh
          scripts/security/check-public-repo-hygiene.sh

      - name: Run Slice 0 audit and hosted-bootstrap unit tests
        run: python3 -m unittest discover -s supabase/audit/tests -t supabase/audit

      # Neither step needs Docker or a running stack: the bootstrap tool opens no database
      # connection in any mode, so both run before the database is started. The dry run's stdout is
      # compared with the committed file here as well as in the failure suite, because a CI job that
      # emitted anything but those bytes would be the first sign the tool had grown a generator.
      - name: Prove the hosted role bootstrap dry run emits exactly the committed file
        run: |
          set -euo pipefail
          supabase/scripts/hosted_role_bootstrap.sh --environment staging --dry-run > "$RUNNER_TEMP/plan.sql"
          cmp supabase/hosted_roles.sql "$RUNNER_TEMP/plan.sql"

      - name: Prove the hosted role bootstrap fails closed
        run: supabase/scripts/hosted_bootstrap_failure_tests.sh

      # Also needs no database: every scenario is a refusal that happens before a connection is
      # attempted. The one case that needs a real checkpoint reports itself as skipped here,
      # because CI has no persistent development database and is not supposed to.
      - name: Prove the local database tooling fails closed
        run: supabase/scripts/local_db_failure_tests.sh

      # Needs no Docker: the harness drives start_local_db.sh against a fake supabase CLI.
      - name: Prove local database start retries only an image-pull failure, once
        run: supabase/scripts/start_local_db_retry_tests.sh

      # Needs no database: proves the fresh-rebuild fixture still names the chain on disk (the
      # check that was missing when it went stale at 25 of 40 migrations), that both clean-room
      # contracts are well formed, and that compare.py fails closed on each.
      - name: Prove the clean-room verification contracts are current and fail closed (static)
        run: supabase/scripts/cleanroom_verify_tests.sh --static

      # At most two attempts. Only a final "failed to pull docker image from all registries"
      # earns the single retry; every other startup failure fails this step immediately.
      - name: Start local database
        run: supabase/scripts/start_local_db.sh

      - name: Prove deterministic migration replay
        run: supabase/scripts/replay_evidence.sh "$RUNNER_TEMP/supabase-replay"

      # Against a minted disposable database carrying the full chain and no business data: the
      # data-bearing contract passes with no rows, the fresh-rebuild contract still fails without
      # the historical load, and seven injected faults (a missing ledger row, a phantom one,
      # a revoked definer EXECUTE, a readable pin_hash, a runtime write on platform.operator, RLS
      # off, an unpinned search_path) each fail closed by name. The restored-copy part needs the
      # development container and reports itself skipped here.
      - name: Prove the clean-room data-bearing contract fails closed on a disposable database
        run: supabase/scripts/cleanroom_verify_tests.sh --chain --cluster cli

      - name: Run pgTAP database tests
        run: supabase test db --local

      # Static analysis cannot prove the hosted bootstrap SQL executes. This applies it to the
      # disposable local database inside one always-rolled-back transaction, under hosted-like
      # conditions, and proves the catalogue is unchanged afterwards.
      - name: Rehearse the hosted role bootstrap against the local database
        run: supabase/scripts/hosted_bootstrap_rehearsal.sh

      - name: Prove runtime-role behavior with direct logins
        run: supabase/scripts/verify_direct_logins.sh

      - name: Prove evidence tooling fails closed
        run: supabase/scripts/evidence_tool_failure_tests.sh

      - name: Prove the Slice 0 audit fails closed
        run: supabase/scripts/audit_failure_tests.sh

      - name: Prove current head differs from frozen Slice 0 only as declared
        run: |
          set -euo pipefail

          rc=0
          supabase/scripts/slice0_audit.sh --mode local || rc=$?
          test "$rc" -eq 1

          python3 supabase/audit/assert_declared_local_head_gap.py \
            supabase/.audit/reports/slice0-audit-local.json

      # The report is re-read from the bytes that would be published, in a separate process, and
      # the upload step below runs only if this one succeeds. A report that fails the credential
      # and project-reference leak assertions is never uploaded, and neither is any raw child
      # output, temporary working directory or failure capture -- only these two sanitised files.
      - name: Prove the audit report carries no credential or project reference
        run: |
          set -euo pipefail
          supabase/scripts/slice0_audit.sh --verify-report supabase/.audit/reports/slice0-audit-local.json
          supabase/scripts/slice0_audit.sh --verify-report supabase/.audit/reports/slice0-audit-local.md

      - name: Upload the sanitised Slice 0 audit report
        uses: actions/upload-artifact@v6
        with:
          name: slice0-audit-local-report
          path: |
            supabase/.audit/reports/slice0-audit-local.json
            supabase/.audit/reports/slice0-audit-local.md
          if-no-files-found: error
          retention-days: 30

      - name: Run database linter and advisors
        run: |
          set -euo pipefail
          supabase db lint --local \
            -s crm,comms,outbound,evidence,catalog,procurement,platform \
            --level warning --fail-on warning
          supabase db advisors --local --type all --level info --fail-on warn

      - name: Stop local stack
        if: always()
        run: supabase stop
