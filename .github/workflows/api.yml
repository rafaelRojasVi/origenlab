name: api

permissions:
  contents: read

on:
  # Production release gate requires this check on EVERY main commit, not only path matches.
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/email-pipeline/**"
      - "supabase/migrations/**"
      - "supabase/roles.sql"
      - ".github/workflows/api.yml"

concurrency:
  group: api-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs never are (the release gate reads them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # validate.sh: no-dev runtime imports, dependency boundary, Phase 6 grep gate, then the whole
  # suite in parallel against a disposable V2 cluster and a V1 Postgres 16. run_pytest.sh fails
  # if a database test skips, so a broken setup cannot pass green.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install ripgrep
        run: |
          set -euo pipefail
          RG_VERSION=14.1.1
          RG_DIR="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 10 --max-time 60 \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_DIR}.tar.gz" \
            -o /tmp/ripgrep.tar.gz
          tar -xzf /tmp/ripgrep.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/${RG_DIR}/rg" /usr/local/bin/rg
      # Not captured: the script's stdout carries the ::add-mask:: commands for the passwords.
      - name: Start disposable databases
        run: scripts/test_db.sh up "$RUNNER_TEMP/test-db.env"
      - name: Test
        env:
          OL_TEST_DB_ENV: ${{ runner.temp }}/test-db.env
        run: make test-api
      - name: Remove the databases
        if: always()
        run: scripts/test_db.sh down "$RUNNER_TEMP/test-db.env"
