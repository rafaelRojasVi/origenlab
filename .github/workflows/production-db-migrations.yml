name: production-db-migrations

# Supabase CI must pass before unattended releases. Schema-first is enforced by Render auto-deploy OFF.
on:
  workflow_run:
    workflows: ["supabase"]
    branches: [main]
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/production-db-migrations.yml"
      - "supabase/scripts/hosted_*.py"
      - "supabase/scripts/hosted_migrations.sh"
      - "supabase/scripts/tests/test_hosted_release.py"
      - "scripts/deploy/render_release.py"
      - "scripts/deploy/check_release_ci.py"
      - "scripts/deploy/configure_release_secrets.sh"
      - "scripts/deploy/set_render_autodeploy_off.py"
      - "scripts/deploy/check_branch_protection.py"
      - "scripts/deploy/verify_workers.py"
      - "docs/runbooks/PRODUCTION_DB_MIGRATIONS.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only plan, encrypted backup, or full guarded release"
        type: choice
        options: [plan, backup_only, release]
        default: plan
  schedule:
    - cron: "15 06 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: origenlab-production-release
  cancel-in-progress: false

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    name: Validate proposed release controller without production access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Syntax and fail-closed unit tests (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile supabase/scripts/hosted_env.py \
            supabase/scripts/hosted_migrations.py supabase/scripts/hosted_backup.py \
            scripts/deploy/render_release.py scripts/deploy/check_release_ci.py \
            scripts/deploy/set_render_autodeploy_off.py scripts/deploy/check_branch_protection.py \
            scripts/deploy/verify_workers.py
          bash -n supabase/scripts/hosted_migrations.sh scripts/deploy/configure_release_secrets.sh
          python3 -m unittest discover -s supabase/scripts/tests -p 'test_hosted_release.py'

  preflight:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.OL_RELEASE_AUTOMATION_ENABLED == 'true') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: origenlab-release
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
      mode: ${{ steps.provenance.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify main SHA, branch and runner syntax
        id: provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          EXECUTION_MODE: ${{ github.event_name == 'schedule' && 'backup_only' || github.event_name == 'workflow_run' && 'release' || inputs.mode }}
          RELEASE_ENABLED: ${{ vars.OL_RELEASE_AUTOMATION_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA" || {
            echo "Superseding main commit exists; refuse stale release"; exit 1;
          }
          case "$EXECUTION_MODE" in plan|backup_only|release) ;; *) exit 1 ;; esac
          if [ "$EXECUTION_MODE" = release ] && [ "$RELEASE_ENABLED" != true ]; then
            echo "First-release hold is active. Test the encrypted backup restore before enabling automatic releases."
            exit 1
          fi
          python3 -m py_compile supabase/scripts/hosted_env.py \
            supabase/scripts/hosted_migrations.py supabase/scripts/hosted_backup.py \
            scripts/deploy/render_release.py scripts/deploy/check_release_ci.py \
            scripts/deploy/set_render_autodeploy_off.py scripts/deploy/check_branch_protection.py \
            scripts/deploy/verify_workers.py
          bash -n supabase/scripts/hosted_migrations.sh
          python3 -m unittest discover -s supabase/scripts/tests -p 'test_hosted_release.py'
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$EXECUTION_MODE" >> "$GITHUB_OUTPUT"
      - name: Refuse unreviewed or CI-unprotected main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy/check_branch_protection.py
      - name: Wait for ALL applicable CI on the pinned main commit
        if: steps.provenance.outputs.mode == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OL_RELEASE_SHA: ${{ steps.provenance.outputs.sha }}
        run: python3 scripts/deploy/check_release_ci.py
      - name: Block any release if independent Render deployments remain enabled
        if: steps.provenance.outputs.mode != 'backup_only'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OL_RELEASE_SHA: ${{ steps.provenance.outputs.sha }}
        run: python3 scripts/deploy/render_release.py check
      - name: Read-only hosted migration plan
        if: steps.provenance.outputs.mode == 'plan'
        env:
          OL_PROD_POOLER_HOST: ${{ secrets.OL_PROD_POOLER_HOST }}
          OL_PROD_PROJECT_REF: ${{ secrets.OL_PROD_PROJECT_REF }}
          OL_PROD_CA_PEM: ${{ secrets.OL_PROD_CA_PEM }}
          OL_PROD_MIGRATOR_PASSWORD: ${{ secrets.OL_PROD_MIGRATOR_PASSWORD }}
        run: python3 supabase/scripts/hosted_migrations.py plan

  backup:
    needs: preflight
    if: needs.preflight.outputs.mode != 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: origenlab-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Install official PostgreSQL 17 and age tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg postgresql-common age
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg\n' \
            "$(lsb_release -cs)" |
            sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Inspect and encrypt application-schema backup
        env:
          OL_PROD_POOLER_HOST: ${{ secrets.OL_PROD_POOLER_HOST }}
          OL_PROD_PROJECT_REF: ${{ secrets.OL_PROD_PROJECT_REF }}
          OL_PROD_CA_PEM: ${{ secrets.OL_PROD_CA_PEM }}
          OL_PROD_MIGRATOR_PASSWORD: ${{ secrets.OL_PROD_MIGRATOR_PASSWORD }}
          OL_PROD_BACKUP_AGE_RECIPIENT: ${{ vars.OL_PROD_BACKUP_AGE_RECIPIENT }}
          OL_PROD_BACKUP_OUT: ${{ runner.temp }}/origenlab-production-snapshot.tar.age
        run: python3 supabase/scripts/hosted_backup.py
      - name: Publish only age-encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: origenlab-encrypted-prod-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/origenlab-production-snapshot.tar.age
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  migrate:
    needs: [preflight, backup]
    if: needs.preflight.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: origenlab-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Refuse superseded commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Apply protected atomic migrations and ledger
        env:
          OL_PROD_POOLER_HOST: ${{ secrets.OL_PROD_POOLER_HOST }}
          OL_PROD_PROJECT_REF: ${{ secrets.OL_PROD_PROJECT_REF }}
          OL_PROD_CA_PEM: ${{ secrets.OL_PROD_CA_PEM }}
          OL_PROD_MIGRATOR_PASSWORD: ${{ secrets.OL_PROD_MIGRATOR_PASSWORD }}
          OL_PROD_BACKUP_VERIFIED: "true"
        run: python3 supabase/scripts/hosted_migrations.py apply

  deploy:
    needs: [preflight, migrate]
    if: needs.preflight.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: origenlab-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Refuse superseded commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Release pinned SHA to worker, cron, API, dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OL_RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: python3 scripts/deploy/render_release.py release

  verify:
    needs: [preflight, deploy]
    if: needs.preflight.outputs.mode == 'release'
    name: Verify worker queue and Gmail cron after release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: origenlab-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Verify worker heartbeat/sweep and successful cron completion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OL_RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          OL_PROD_POOLER_HOST: ${{ secrets.OL_PROD_POOLER_HOST }}
          OL_PROD_PROJECT_REF: ${{ secrets.OL_PROD_PROJECT_REF }}
          OL_PROD_CA_PEM: ${{ secrets.OL_PROD_CA_PEM }}
          OL_PROD_MIGRATOR_PASSWORD: ${{ secrets.OL_PROD_MIGRATOR_PASSWORD }}
        run: python3 scripts/deploy/verify_workers.py
