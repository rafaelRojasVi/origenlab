name: repo-scripts

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/**"

concurrency:
  group: repo-scripts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make test-repo
