name: worker

permissions:
  contents: read

on:
  # Production release gate requires this check on EVERY main commit, not only path matches.
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "apps/worker/**"
      - "apps/email-pipeline/**"
      # The worker depends on apps/api (the case archive) and shares its test harness.
      - "apps/api/**"
      - "supabase/migrations/**"
      - "supabase/roles.sql"
      - "render.yaml"
      - "scripts/run_pytest.sh"
      - "scripts/test_db.sh"
      - "scripts/pytest_plugins/**"
      - ".github/workflows/worker.yml"

concurrency:
  group: worker-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs never are (the release gate reads them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole suite in parallel against a disposable V2 cluster, as the real origenlab_worker
  # login; run_pytest.sh fails if a database test skips.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Not captured: the script's stdout carries the ::add-mask:: commands for the passwords.
      - name: Start disposable databases
        run: scripts/test_db.sh up "$RUNNER_TEMP/test-db.env" --v2
      - name: Test
        env:
          OL_TEST_DB_ENV: ${{ runner.temp }}/test-db.env
        run: make test-worker
      - name: Remove the databases
        if: always()
        run: scripts/test_db.sh down "$RUNNER_TEMP/test-db.env"
