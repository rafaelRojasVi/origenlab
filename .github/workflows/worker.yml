name: worker

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/worker/**"
      - "apps/email-pipeline/**"
      - "apps/api/tests/v2_command_harness.py"
      - "apps/api/tests/protected_databases.py"
      - "apps/api/scripts/disposable_test_cluster.sh"
      - "supabase/migrations/**"
      - "supabase/roles.sql"
      - "render.yaml"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "apps/worker/**"
      - "apps/email-pipeline/**"
      - "apps/api/tests/v2_command_harness.py"
      - "apps/api/tests/protected_databases.py"
      - "apps/api/scripts/disposable_test_cluster.sh"
      - "supabase/migrations/**"
      - "supabase/roles.sql"
      - "render.yaml"
      - ".github/workflows/worker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: ./scripts/validate.sh
