name: dashboard-proxy

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "apps/dashboard-proxy/**"
      - ".github/workflows/dashboard-proxy.yml"

concurrency:
  group: dashboard-proxy-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs never are (the release gate reads them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/dashboard-proxy/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard-proxy
      - run: make test-proxy
