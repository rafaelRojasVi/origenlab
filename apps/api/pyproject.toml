[project]
name = "origenlab-api"
version = "0.1.0"
description = "Read-only operator API (SQLite-first) for OrigenLab email-pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "origenlab-email-pipeline",
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    # Imported at app startup by /mirror route dependencies.
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    { include-group = "postgres" },
]
postgres = ["psycopg[binary]>=3.2"]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# CRM-Q1 Drive activation: credentials for the quote Drive workspace adapter
# (uv sync --extra drive). Installed in the production image (Dockerfile).
drive = ["google-auth>=2"]
# Operator-only, local one-time OAuth bootstrap (scripts/authorize_drive_user.py).
# Deliberately NOT part of the `drive` extra above: the running API only
# ever refreshes an existing token (google-auth alone suffices for that);
# it never runs the interactive browser consent flow, so the production
# image has no reason to carry this.
drive-bootstrap = ["google-auth-oauthlib>=1"]

[tool.uv.sources]
origenlab-email-pipeline = { path = "../email-pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/origenlab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
