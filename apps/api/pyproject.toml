[project]
name = "origenlab-api"
version = "0.1.0"
description = "Read-only operator API (SQLite-first) for OrigenLab email-pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "origenlab-email-pipeline",
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    # Imported at app startup by /mirror route dependencies.
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    { include-group = "postgres" },
]
postgres = ["psycopg[binary]>=3.2"]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# CRM-Q1 Drive activation only: service-account credentials for the quote
# Drive workspace adapter (uv sync --extra drive). Not a default runtime dep.
drive = ["google-auth>=2"]

[tool.uv.sources]
origenlab-email-pipeline = { path = "../email-pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/origenlab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
