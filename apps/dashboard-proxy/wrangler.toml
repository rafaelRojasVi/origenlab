name = "origenlab-dashboard-proxy"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[vars]
ORIGENLAB_API_UPSTREAM = "https://api.origenlab.cl"

[[routes]]
pattern = "dashboard.origenlab.cl/api*"
zone_name = "origenlab.cl"

[[routes]]
pattern = "origenlab.cl/api/web/*"
zone_name = "origenlab.cl"

# Rate-limit binding for the public web quote form.
# Owner: replace namespace_id with the output of: wrangler ratelimit create --name "web-form-submissions"
[[ratelimits]]
name = "WEB_FORM_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }