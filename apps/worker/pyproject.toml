[project]
name = "origenlab-worker"
version = "0.1.0"
description = "V2 worker — Gmail capture into the hosted V2 database (Phase 4a) and mail triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "origenlab-email-pipeline",
    # The case-first Drive archive (`origenlab_api.v2.quote_case_archive`): one folder per case,
    # one verified file per document. Pure; the worker supplies the Drive port (drive_client.py).
    "origenlab-api",
    "psycopg[binary]>=3.2",
    "boto3>=1.36",
    # The mail-triage queue. Pinned exactly: supabase/migrations/20261006180000 vendors this
    # version's schema, and tests/test_queue_schema.py fails if the two ever differ. An upgrade is
    # a new migration (Procrastinate's own sql/migrations/*.sql) in the same change as this pin.
    "procrastinate[psycopg]==3.10.0",
    # The triage's model stage (triage_model.py): the official SDK, as apps/api's enrichment uses.
    "anthropic>=1.11.0",
]

[project.scripts]
origenlab-worker = "origenlab_worker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[server]>=5.1",
]
# Owner-only, local, once: the browser consent of scripts/gmail_readonly_authorize.py. The cron
# never runs a consent flow, so the Render install (`--no-dev`, no groups) does not carry it.
bootstrap = ["google-auth-oauthlib>=1"]

[tool.uv.sources]
origenlab-email-pipeline = { path = "../email-pipeline", editable = true }
origenlab-api = { path = "../api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/origenlab_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ../api/tests: the one disposable-database harness both apps share (v2_command_harness.py).
pythonpath = ["src", "tests", "../api/tests"]
