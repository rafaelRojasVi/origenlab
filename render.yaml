# OrigenLab Today — Phase 1 cloud read path (manual mirror sync from local worker).
# Apply: render blueprint launch or connect repo and use this spec.
#
# Prerequisites: operator runs sync_dashboard_mirror_to_cloud.sh from laptop/VPS
# with ORIGENLAB_CLOUD_POSTGRES_URL (see apps/email-pipeline/docs/PHASE1_CLOUD_READ_PATH.md).

databases:
  - name: origenlab-dashboard-db
    databaseName: origenlab_dashboard
    user: origenlab
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: origenlab-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    # Persistent disk for the W1 institution-prospect file-backed read model.
    # The local worker publishes to institution_prospects/ on this disk via
    # sync_institution_prospects_to_cloud.sh; the API reads it on every request.
    # Required: Render paid plan with persistent disk support.
    disk:
      name: w1-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ORIGENLAB_ENV
        value: production
      - key: ORIGENLAB_API_BACKEND
        value: postgres
      - key: ORIGENLAB_API_DISABLE_DOCS
        value: "true"
      - key: ORIGENLAB_API_CORS_ORIGINS
        value: https://dashboard.origenlab.cl
      - key: ORIGENLAB_API_ALLOWED_HOSTS
        value: api.origenlab.cl
      # W1 institution-prospect read model directory on the persistent disk.
      # Must match the mountPath above + the canonical bundle subdirectory name.
      # The API reads this path on every request; symlink follows on resolve().
      - key: ORIGENLAB_INSTITUTION_PROSPECT_DIR
        value: /var/data/institution_prospects
      # T1 tender-terms read model directory on the same persistent disk.
      - key: ORIGENLAB_TENDER_TERMS_DIR
        value: /var/data/tender_terms
      # Explicit operator-uploaded annex/T1 overlays. Kept separate from the
      # canonical T1 bundle so a later canonical sync cannot erase them.
      - key: ORIGENLAB_OPERATOR_TENDER_IMPORT_DIR
        value: /var/data/operator_tender_imports
      - key: ORIGENLAB_API_AUTH_TOKEN
        sync: false
      - key: ORIGENLAB_POSTGRES_URL
        fromDatabase:
          name: origenlab-dashboard-db
          property: connectionString

  - type: web
    name: origenlab-dashboard
    runtime: static
    buildCommand: >-
      cd apps/dashboard &&
      npm ci &&
      VITE_ORIGENLAB_API_BASE_URL=https://dashboard.origenlab.cl/api npm run build
    staticPublishPath: apps/dashboard/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_ORIGENLAB_API_BASE_URL
        value: https://dashboard.origenlab.cl/api
    routes:
      - type: headers
        source: /*
        headers:
          - key: X-Content-Type-Options
            value: nosniff
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: X-Frame-Options
            value: DENY
          - key: X-Robots-Tag
            value: noindex, nofollow
      - type: rewrite
        source: /*
        destination: /index.html
